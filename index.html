<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELNIKO - Official Shop</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151f32;
            --text-color: #ffffff;
            --accent-color: #ccff00; /* Il colore Lime in stile Emergent */
            --text-muted: #8a99ad;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
        }
        header h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1.1rem;
        }
        .container {
            max-width: 1000px;
            width: 90%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding-bottom: 60px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card-img {
            width: 100%;
            height: 250px;
            background-color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card-title {
            font-size: 1.3rem;
            margin: 0 0 10px 0;
        }
        .card-price {
            font-size: 1.4rem;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            text-align: center;
            background-color: var(--accent-color);
            color: #000;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: auto;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        footer {
            margin-top: auto;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        footer a {
            color: var(--accent-color);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>ELNIKO CREW</h1>
        <p>Benvenuto nell'hub ufficiale del Merch. Seleziona un prodotto per completare l'acquisto in sicurezza sul nostro store.</p>
    </header>

    <div class="container">
        <!-- PRODOTTO 1 -->
        <div class="card">
            <div class="card-img">🛍️ Anteprima Felpa</div>
            <div class="card-content">
                <h3 class="card-title">Felpa Official Lime</h3>
                <div class="card-price">€45,00</div>
                <a href="https://elniko-flvshop-com-shop.fourthwall.com" target="_blank" class="btn">Acquista su Fourthwall</a>
            </div>
        </div>

        <!-- PRODOTTO 2 -->
        <div class="card">
            <div class="card-img">🛍️ Anteprima Maglietta</div>
            <div class="card-content">
                <h3 class="card-title">T-Shirt Logo Dark</h3>
                <div class="card-price">€25,00</div>
                <a href="https://elniko-flvshop-com-shop.fourthwall.com" target="_blank" class="btn">Acquista su Fourthwall</a>
            </div>
        </div>
    </div>

    <footer>
        Gestito con <a href="https://elniko-flvshop-com-shop.fourthwall.com" target="_blank">Fourthwall</a>
    </footer>

</body>
</html>
